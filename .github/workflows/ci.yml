name: Learning checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-learning:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            pi-practice-00/package-lock.json
            labs/package-lock.json
      - name: Install practice dependencies
        run: npm ci --ignore-scripts --prefix pi-practice-00
      - name: Install lab dependencies
        run: npm ci --ignore-scripts --prefix labs
      - name: Check documentation and checker tests
        run: npm run check:docs && npm run check:versions && npm run test:docs
      - name: Check and run the preserved chapter 00 fixture
        run: npm run check:practice && npm run test:practice && npm run demo:practice
      - name: Check and run official API labs offline
        run: npm run check:labs && npm run test:labs && npm run demo:labs
      - name: Compile and test the pinned complete course on Linux
        if: runner.os == 'Linux'
        run: |
          node pi-practice-00/node_modules/typescript/bin/tsc -p pi-course/packages/pi-course/tsconfig.json --typeRoots pi-practice-00/node_modules/@types
          node --test pi-course/packages/pi-course/dist/test/*.test.js
